<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>PhotonBounce 3D Arena — Real Baked-Texture Models, Skins &amp; Cutout</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0c1018; color: #eef3fa; font-family: system-ui, -apple-system, Segoe UI, sans-serif; touch-action: none; }
  #topbar {
    position: fixed; top: 10px; left: 10px; right: 10px; z-index: 20;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    pointer-events: none;
  }
  #topbar > * { pointer-events: auto; }
  .pill {
    background: rgba(12, 17, 28, 0.88); border: 1px solid rgba(110, 175, 255, 0.42);
    border-radius: 10px; padding: 8px 12px; font-size: 13px; color: #eef3fa;
    backdrop-filter: blur(10px); cursor: pointer; font-weight: 600;
  }
  #drawer {
    position: fixed; top: 54px; left: 10px; z-index: 19; width: min(330px, calc(100vw - 20px));
    max-height: calc(100vh - 135px); overflow-y: auto;
    background: rgba(11, 16, 26, 0.92); border: 1px solid rgba(110, 175, 255, 0.42);
    border-radius: 12px; padding: 12px 14px; backdrop-filter: blur(12px);
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  #drawer.collapsed { display: none; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 7px 0; font-size: 13px; }
  select, input[type="range"] { flex: 1; max-width: 195px; background: #172033; color: #eef3fa; border: 1px solid #354a6e; border-radius: 7px; padding: 6px 8px; font-size: 13px; }
  button.ctrl {
    background: #1b2840; color: #eef3fa; border: 1px solid #3b5682; border-radius: 8px;
    padding: 8px 11px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  button.ctrl:active, button.ctrl.active { background: #2c4b7d; border-color: #84c0ff; }
  #bottomBar {
    position: fixed; bottom: 12px; left: 10px; right: 10px; z-index: 20;
    display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; pointer-events: none;
  }
  #bottomBar button { pointer-events: auto; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  #btnFire { background: #b82d2d; border-color: #ff6b6b; color: #fff; padding: 10px 18px; font-size: 14px; }
  #btnFire:active { background: #e03c3c; }
  #loader {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 30;
    background: rgba(10, 15, 25, 0.92); border: 1px solid rgba(120, 190, 255, 0.5);
    border-radius: 12px; padding: 14px 20px; text-align: center; min-width: 240px;
    pointer-events: none;
  }
  #loader.hidden { display: none; }
  #progWrap { width: 100%; height: 7px; background: #1a2438; border-radius: 99px; overflow: hidden; margin-top: 8px; }
  #progBar { width: 0%; height: 100%; background: linear-gradient(90deg, #4da6ff, #6ff7b8); transition: width 0.1s; }
  #modelInfo { font-size: 12px; color: #9fc7ff; }
</style>
</head>
<body>

<div id="topbar">
  <button id="btnToggleDrawer" class="pill">☰ Models / Skins / Cutout</button>
  <div id="modelInfo" class="pill">SVD Dragunov PSO-1</div>
</div>

<div id="drawer">
  <div class="row">
    <span>Model:</span>
    <select id="platformSelect">
      <option value="svd" selected>SVD Dragunov PSO-1 (45 MB, Baked PBR)</option>
      <option value="ak47">AK-47 Scoped + GP-25 UBGL (41 MB)</option>
      <option value="pkm">PKM GPMG (62 MB, Baked PBR)</option>
      <option value="makarov">Makarov PM (68 MB, Baked PBR)</option>
      <option value="t64bv">T-64BV Tank + Interior Cutaway (54 MB)</option>
      <option value="t72b3">T-72B3 MBT (16.5 MB)</option>
      <option value="leopard2a4">Leopard 2A4 MBT (17.4 MB)</option>
      <option value="bmp3">BMP-3 IFV (72.8 MB, Baked PBR)</option>
      <option value="rpg7">RPG-7V Launcher (0.6 MB)</option>
      <option value="javelin">FGM-148 Javelin ATGM (5.9 MB)</option>
      <option value="gatling">M134 Gatling Rotary (21 MB)</option>
      <option value="vortex">Vortex V12 Glass Cutaway (0.8 MB)</option>
    </select>
  </div>
  <div class="row">
    <span>Skin / Camo:</span>
    <select id="skinSelect">
      <option value="factory">Factory Original (Baked Textures)</option>
      <option value="4bo">Soviet 4BO Olive Drab</option>
      <option value="nato">NATO Bronzegrün</option>
      <option value="desert">Desert Sand Tan</option>
      <option value="winter">Winter Whitewash</option>
      <option value="tactical">Tactical Matte Black</option>
      <option value="steel">Battle-Worn Gunmetal</option>
    </select>
  </div>
  <div class="row">
    <span>Cutout Mode:</span>
    <select id="cutoutMode">
      <option value="solid">Solid Exterior</option>
      <option value="cutaway">Cutout GLB + Live 3D Slice</option>
      <option value="xray">X-Ray Internal Workings</option>
    </select>
  </div>
  <div class="row">
    <span>3D Slice Plane:</span>
    <input id="cutoutSlider" type="range" min="-100" max="100" value="100" />
  </div>
  <div class="row" style="justify-content:flex-start; gap:6px; flex-wrap:wrap; margin-top:10px;">
    <button id="btnSpin" class="ctrl">360° Spin: OFF</button>
    <button id="btnResetCam" class="ctrl">Reset View</button>
    <button id="btnDropGlb" class="ctrl">Load Local .GLB</button>
    <input id="glbFile" type="file" accept=".glb,.gltf" style="display:none" />
  </div>
  <div style="margin-top:8px; font-size:11px; color:#8ea6c9; line-height:1.4;">
    Drag to orbit 360° • Pinch / Scroll to zoom • Tap FIRE to shoot targets • Slide 3D Slice Plane or pick X-Ray to inspect internal workings.
  </div>
</div>

<div id="loader">
  <div id="loaderText" style="font-size:13px; font-weight:600;">Loading real baked-texture model...</div>
  <div id="progWrap"><div id="progBar"></div></div>
</div>

<div id="bottomBar">
  <button id="btnFire" class="ctrl">FIRE</button>
  <button id="btnQuickCutout" class="ctrl">Cutout: OFF</button>
  <button id="btnQuickSkin" class="ctrl">Next Skin</button>
  <button id="btnNextModel" class="ctrl">Next Model ▸</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const isMobile = window.innerWidth < 768;
const drawer = document.getElementById('drawer');
if (isMobile) drawer.classList.add('collapsed');
document.getElementById('btnToggleDrawer').addEventListener('click', () => drawer.classList.toggle('collapsed'));

// Renderer with PBR Tone Mapping + Local Clipping
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.localClippingEnabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101622);
scene.fog = new THREE.FogExp2(0x101622, 0.012);

// Studio PBR environment reflections so blued steel & wood pop
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(isMobile ? 52 : 45, innerWidth / innerHeight, 0.05, 250);
camera.position.set(0, 1.35, isMobile ? 3.8 : 2.9);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.target.set(0, 0.9, 0);
controls.minDistance = 0.6;
controls.maxDistance = 14;

// Lighting
scene.add(new THREE.HemisphereLight(0xc2dcff, 0x262c36, 0.9));
const keyLight = new THREE.DirectionalLight(0xfff5e4, 2.4);
keyLight.position.set(6, 10, 7);
keyLight.castShadow = true;
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0x7eb8ff, 1.2);
rimLight.position.set(-7, 5, -6);
scene.add(rimLight);

// Proving Ground Floor + Target Range Wall
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(140, 140),
  new THREE.MeshStandardMaterial({ color: 0x1a202c, roughness: 0.88, metalness: 0.12 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
scene.add(new THREE.GridHelper(120, 40, 0x3b5075, 0x202838));

// Destructible Range Target Wall downrange (-Z)
const blocks = [];
function buildRangeTargets() {
  blocks.forEach(b => scene.remove(b.mesh));
  blocks.length = 0;
  const mat1 = new THREE.MeshStandardMaterial({ color: 0x7c8492, roughness: 0.85 });
  const mat2 = new THREE.MeshStandardMaterial({ color: 0x99533e, roughness: 0.85 });
  for (let row = 0; row < 4; row++) {
    for (let col = -2; col <= 2; col++) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.75, 0.6), (row + col) % 2 === 0 ? mat1 : mat2);
      m.position.set(col * 1.15, 0.375 + row * 0.76, -14);
      m.castShadow = true;
      scene.add(m);
      blocks.push({ mesh: m, vel: new THREE.Vector3(), ang: new THREE.Vector3(), awake: false });
    }
  }
}
buildRangeTargets();

// Model Registry — real baked-texture GLBs staged in arena/models/
const MODELS = {
  svd:        { label: 'SVD Dragunov PSO-1', std: 'models/svd.glb', cut: 'models/svd_cutaway.glb', heavy: false },
  ak47:       { label: 'AK-47 Scoped + GP-25', std: 'models/ak47.glb', cut: 'models/ak47_cutaway.glb', heavy: false },
  pkm:        { label: 'PKM GPMG', std: 'models/pkm.glb', cut: 'models/pkm.glb', heavy: false },
  makarov:    { label: 'Makarov PM', std: 'models/makarov.glb', cut: 'models/makarov.glb', heavy: false },
  t64bv:      { label: 'T-64BV Tank + Interior', std: 'models/t64bv_cutaway.glb', cut: 'models/t64bv_cutaway.glb', heavy: true },
  t72b3:      { label: 'T-72B3 MBT', std: 'models/t72b3.glb', cut: 'models/t72b3.glb', heavy: true },
  leopard2a4: { label: 'Leopard 2A4 MBT', std: 'models/leopard2a4.glb', cut: 'models/leopard2a4.glb', heavy: true },
  bmp3:       { label: 'BMP-3 IFV', std: 'models/bmp3.glb', cut: 'models/bmp3.glb', heavy: true },
  rpg7:       { label: 'RPG-7V Launcher', std: 'models/rpg7.glb', cut: 'models/rpg7.glb', heavy: true },
  javelin:    { label: 'FGM-148 Javelin', std: 'models/javelin.glb', cut: 'models/javelin.glb', heavy: true },
  gatling:    { label: 'M134 Gatling Rotary', std: 'models/gatling.glb', cut: 'models/gatling.glb', heavy: false },
  vortex:     { label: 'Vortex V12 Cutaway', std: 'models/vortex_cutaway.glb', cut: 'models/vortex_cutaway.glb', heavy: false }
};

const SKINS = {
  factory: null,
  '4bo': { color: 0x4b5c3a, roughness: 0.65, metalness: 0.22 },
  nato: { color: 0x3f4f3c, roughness: 0.62, metalness: 0.25 },
  desert: { color: 0xc8af82, roughness: 0.76, metalness: 0.12 },
  winter: { color: 0xe2e8f0, roughness: 0.72, metalness: 0.08 },
  tactical: { color: 0x20252e, roughness: 0.50, metalness: 0.48 },
  steel: { color: 0x5c6675, roughness: 0.30, metalness: 0.88 }
};

const stageGroup = new THREE.Group();
stageGroup.position.set(0, 0.9, 0);
scene.add(stageGroup);

const gltfLoader = new GLTFLoader();
const modelCache = {};
const clipPlane = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 5);
let activePlatform = 'svd';
let activeSkin = 'factory';
let activeCutout = 'solid';
let autoSpin = false;
let recoilOffset = 0;

function applySkinAndCutout(root) {
  const skin = SKINS[activeSkin];
  const sliceVal = Number(document.getElementById('cutoutSlider').value) / 100;
  clipPlane.constant = sliceVal * 1.45;
  root.traverse((o) => {
    if (!o.isMesh || !o.material) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    mats.forEach((m) => {
      if (!m.userData.origSaved) {
        m.userData.origSaved = true;
        m.userData.origColor = m.color ? m.color.clone() : null;
        m.userData.origRough = m.roughness;
        m.userData.origMetal = m.metalness;
      }
      if (skin && m.color) {
        m.color.setHex(skin.color);
        if (typeof m.roughness === 'number') m.roughness = skin.roughness;
        if (typeof m.metalness === 'number') m.metalness = skin.metalness;
      } else if (m.userData.origColor && m.color) {
        m.color.copy(m.userData.origColor);
        m.roughness = m.userData.origRough;
        m.metalness = m.userData.origMetal;
      }
      if (activeCutout === 'xray') {
        m.transparent = true; m.opacity = 0.28; m.depthWrite = false; m.clippingPlanes = [];
      } else if (activeCutout === 'cutaway') {
        m.transparent = false; m.opacity = 1.0; m.depthWrite = true; m.clippingPlanes = [clipPlane]; m.clipShadows = true;
      } else {
        m.transparent = false; m.opacity = 1.0; m.depthWrite = true; m.clippingPlanes = [];
      }
      m.needsUpdate = true;
    });
  });
}

function frameCameraForModel(isHeavy) {
  const dist = isMobile ? (isHeavy ? 4.2 : 3.2) : (isHeavy ? 3.2 : 2.3);
  camera.position.set(dist * 0.72, 1.35, dist * 0.72);
  controls.target.set(0, 0.9, 0);
  controls.update();
}

function mountModel(obj, isHeavy) {
  stageGroup.clear();
  const clone = obj.clone(true);
  applySkinAndCutout(clone);
  stageGroup.add(clone);
  frameCameraForModel(isHeavy);
}

function loadPlatform(key) {
  activePlatform = key;
  const spec = MODELS[key];
  if (!spec) return;
  document.getElementById('modelInfo').textContent = spec.label;
  const url = (activeCutout === 'cutaway' && spec.cut) ? spec.cut : spec.std;
  const cacheKey = `${key}:${url}`;
  const loaderEl = document.getElementById('loader');
  const loaderTxt = document.getElementById('loaderText');
  const progBar = document.getElementById('progBar');

  if (modelCache[cacheKey]) {
    loaderEl.classList.add('hidden');
    mountModel(modelCache[cacheKey], spec.heavy);
    return;
  }

  loaderEl.classList.remove('hidden');
  loaderTxt.textContent = `Loading ${spec.label}...`;
  progBar.style.width = '8%';

  gltfLoader.load(
    url,
    (gltf) => {
      const obj = gltf.scene;
      const box = new THREE.Box3().setFromObject(obj);
      const sz = box.getSize(new THREE.Vector3());
      const ctr = box.getCenter(new THREE.Vector3());
      obj.position.sub(ctr);
      const wrap = new THREE.Group();
      wrap.add(obj);
      const targetSpan = spec.heavy ? 2.6 : 2.1;
      const sc = targetSpan / Math.max(sz.x, sz.y, sz.z, 0.001);
      wrap.scale.setScalar(sc);
      modelCache[cacheKey] = wrap;
      if (activePlatform === key) {
        loaderEl.classList.add('hidden');
        mountModel(wrap, spec.heavy);
      }
    },
    (xhr) => {
      if (xhr.total > 0) {
        const pct = Math.min(99, Math.round((xhr.loaded / xhr.total) * 100));
        progBar.style.width = pct + '%';
        loaderTxt.textContent = `Loading ${spec.label}... ${pct}%`;
      }
    },
    () => {
      loaderTxt.textContent = `Could not load ${url} — tap "Load Local .GLB"`;
    }
  );
}

// Shooting: Ballistic Tracers + Muzzle Flash + Target Collapse
const projectiles = [];
const flashes = [];
function fireRound() {
  const isHeavy = MODELS[activePlatform]?.heavy;
  recoilOffset = isHeavy ? 0.25 : 0.09;
  const start = new THREE.Vector3(0, 0.95, -1.0);
  const target = new THREE.Vector3((Math.random() - 0.5) * 2.2, 1.0 + Math.random() * 1.4, -14);
  const dir = target.clone().sub(start).normalize();
  const rad = isHeavy ? 0.11 : 0.04;
  const proj = new THREE.Mesh(
    new THREE.SphereGeometry(rad, 10, 10),
    new THREE.MeshBasicMaterial({ color: isHeavy ? 0xff9933 : 0xffe46b })
  );
  proj.position.copy(start);
  scene.add(proj);
  projectiles.push({ mesh: proj, vel: dir.multiplyScalar(isHeavy ? 42 : 70), isHeavy, life: 2.0 });

  const fl = new THREE.PointLight(0xffb84d, isHeavy ? 18 : 8, 16);
  fl.position.copy(start);
  scene.add(fl);
  flashes.push({ light: fl, life: 0.09 });
}

// UI Bindings
document.getElementById('platformSelect').addEventListener('change', (e) => loadPlatform(e.target.value));
document.getElementById('skinSelect').addEventListener('change', (e) => { activeSkin = e.target.value; applySkinAndCutout(stageGroup); });
document.getElementById('cutoutMode').addEventListener('change', (e) => {
  activeCutout = e.target.value;
  document.getElementById('btnQuickCutout').textContent = activeCutout === 'solid' ? 'Cutout: OFF' : `Cutout: ${activeCutout.toUpperCase()}`;
  loadPlatform(activePlatform);
});
document.getElementById('cutoutSlider').addEventListener('input', () => {
  if (activeCutout === 'solid') {
    activeCutout = 'cutaway';
    document.getElementById('cutoutMode').value = 'cutaway';
    document.getElementById('btnQuickCutout').textContent = 'Cutout: CUTAWAY';
  }
  applySkinAndCutout(stageGroup);
});
document.getElementById('btnSpin').addEventListener('click', (e) => {
  autoSpin = !autoSpin;
  e.target.textContent = autoSpin ? '360° Spin: ON' : '360° Spin: OFF';
});
document.getElementById('btnResetCam').addEventListener('click', () => {
  frameCameraForModel(MODELS[activePlatform]?.heavy);
  buildRangeTargets();
});
document.getElementById('btnFire').addEventListener('click', fireRound);
document.getElementById('btnQuickCutout').addEventListener('click', () => {
  const order = ['solid', 'cutaway', 'xray'];
  activeCutout = order[(order.indexOf(activeCutout) + 1) % order.length];
  document.getElementById('cutoutMode').value = activeCutout;
  if (activeCutout === 'cutaway') document.getElementById('cutoutSlider').value = 10;
  document.getElementById('btnQuickCutout').textContent = activeCutout === 'solid' ? 'Cutout: OFF' : `Cutout: ${activeCutout.toUpperCase()}`;
  loadPlatform(activePlatform);
});
document.getElementById('btnQuickSkin').addEventListener('click', () => {
  const keys = Object.keys(SKINS);
  activeSkin = keys[(keys.indexOf(activeSkin) + 1) % keys.length];
  document.getElementById('skinSelect').value = activeSkin;
  applySkinAndCutout(stageGroup);
});
document.getElementById('btnNextModel').addEventListener('click', () => {
  const keys = Object.keys(MODELS);
  const next = keys[(keys.indexOf(activePlatform) + 1) % keys.length];
  document.getElementById('platformSelect').value = next;
  loadPlatform(next);
});
document.getElementById('btnDropGlb').addEventListener('click', () => document.getElementById('glbFile').click());
document.getElementById('glbFile').addEventListener('change', (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const url = URL.createObjectURL(f);
  gltfLoader.load(url, (gltf) => {
    const obj = gltf.scene;
    const box = new THREE.Box3().setFromObject(obj);
    const sz = box.getSize(new THREE.Vector3());
    const ctr = box.getCenter(new THREE.Vector3());
    obj.position.sub(ctr);
    const wrap = new THREE.Group();
    wrap.add(obj);
    wrap.scale.setScalar(2.2 / Math.max(sz.x, sz.y, sz.z, 0.001));
    document.getElementById('modelInfo').textContent = f.name;
    mountModel(wrap, false);
  });
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  controls.update();

  if (autoSpin) stageGroup.rotation.y += dt * 0.7;
  if (recoilOffset > 0.001) {
    recoilOffset = Math.max(0, recoilOffset - dt * 1.4);
    stageGroup.position.z = recoilOffset;
  } else {
    stageGroup.position.z = 0;
  }

  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.mesh.position.addScaledVector(p.vel, dt);
    p.life -= dt;
    let hit = false;
    for (const b of blocks) {
      if (b.mesh.position.distanceTo(p.mesh.position) < (p.isHeavy ? 1.8 : 0.85)) {
        b.awake = true;
        b.vel.set((Math.random() - 0.5) * 6, 3 + Math.random() * 4, -5 - Math.random() * 5);
        b.ang.set((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
        hit = true;
      }
    }
    if (hit || p.life <= 0) {
      scene.remove(p.mesh);
      projectiles.splice(i, 1);
    }
  }
  for (const b of blocks) {
    if (!b.awake) continue;
    b.vel.y -= 14 * dt;
    b.mesh.position.addScaledVector(b.vel, dt);
    b.mesh.rotation.x += b.ang.x * dt;
    b.mesh.rotation.y += b.ang.y * dt;
    if (b.mesh.position.y < 0.375) {
      b.mesh.position.y = 0.375;
      b.vel.multiplyScalar(0.5);
      b.vel.y = Math.abs(b.vel.y) * 0.3;
    }
  }
  for (let i = flashes.length - 1; i >= 0; i--) {
    flashes[i].life -= dt;
    if (flashes[i].life <= 0) { scene.remove(flashes[i].light); flashes.splice(i, 1); }
  }
  renderer.render(scene, camera);
}

loadPlatform('svd');
animate();
</script>
</body>
</html>
