<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>PhotonBounce Business Demos</title>
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --text:#17202b; --muted:#5b6b7f; --line:#dde3ea;
  --accent:#1d4ed8; --accent-dark:#1e3a8a; --accent-soft:#e8efff; --user-bg:#1d4ed8; --user-text:#fff;
  --bot-bg:#eef2f7; --radius:16px; --shadow:0 4px 24px rgba(15,35,75,.07);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f141c; --card:#1a2230; --text:#e8edf3; --muted:#9fb0c3; --line:#2a3648; --accent:#5b8cff; --accent-dark:#8fb0ff; --accent-soft:#1e2e4d; --bot-bg:#232f42; --shadow:0 4px 24px rgba(0,0,0,.35); }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button,[role="button"],input,textarea,select{font:inherit}
button{min-height:44px}
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-inner{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:-.02em;font-size:20px;color:var(--text)}
.brand span{color:var(--accent)}
.topbar-sub{font-size:13.5px;color:var(--muted)}
.wrap{max-width:1120px;margin:0 auto;padding:24px 20px 40px}
.hero{padding:8px 0 8px}
.hero h1{font-size:clamp(28px,5vw,42px);line-height:1.05;letter-spacing:-.03em;margin:6px 0 10px;font-weight:800}
.hero p{color:var(--muted);font-size:17px;max-width:720px;margin:0}
.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
.search-row{margin:22px 0 16px;display:flex;gap:10px;flex-wrap:wrap}
.search-row input{flex:1;min-width:220px;padding:12px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--text);min-height:48px}
.count{font-size:13px;color:var(--muted);align-self:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:8px}
.biz-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.biz-card h3{margin:0;font-size:17px;line-height:1.25}
.biz-card p{margin:0;color:var(--muted);font-size:14px;line-height:1.45;flex:1}
.biz-meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.biz-link{margin-top:10px;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.lang-badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent-dark);padding:3px 7px;border-radius:999px}
@media(prefers-color-scheme:dark){.lang-badge{color:#c7d7ff}}
/* Demo page */
.backlink{display:inline-flex;align-items:center;min-height:44px;font-weight:600;font-size:14px;margin-bottom:6px}
.biz-header{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--shadow)}
.biz-header h1{margin:0 0 6px;font-size:clamp(26px,4.5vw,36px);line-height:1.1;letter-spacing:-.02em}
.tagline{font-size:17px;color:var(--text);margin:0 0 10px}
.contact-line{color:var(--muted);font-size:14.5px;display:flex;flex-wrap:wrap;gap:6px 10px}
.contact-line a{color:var(--accent);font-weight:600}
.layout{display:grid;grid-template-columns:1.65fr .95fr;gap:18px;margin-top:18px;align-items:start}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.chat-card{overflow:hidden;display:flex;flex-direction:column}
.chat-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;flex-shrink:0}
.chat-head strong{display:block;line-height:1.2}
.chat-head small{color:var(--muted)}
.online{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#15803d;font-weight:600}
.online::before{content:"";width:8px;height:8px;background:#22c55e;border-radius:50%;display:inline-block}
.messages{padding:18px;display:flex;flex-direction:column;gap:12px;min-height:340px;max-height:520px;overflow-y:auto;background:var(--card)}
.msg{max-width:86%;padding:11px 14px;border-radius:16px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msg.bot{background:var(--bot-bg);align-self:flex-start;border-bottom-left-radius:4px}
.msg.user{background:var(--user-bg);color:var(--user-text);align-self:flex-end;border-bottom-right-radius:4px}
.typing{align-self:flex-start;background:var(--bot-bg);padding:12px 16px;border-radius:16px;border-bottom-left-radius:4px;display:none;gap:5px}
.typing.show{display:flex}
.typing span{width:7px;height:7px;background:var(--muted);border-radius:50%;animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.chips-wrap{padding:0 18px 14px;border-top:1px solid var(--line)}
.chips-label{font-size:12.5px;color:var(--muted);font-weight:600;margin:12px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--accent-dark);padding:8px 12px;border-radius:999px;font-size:13.5px;cursor:pointer;min-height:40px;text-align:left;line-height:1.3}
@media(prefers-color-scheme:dark){.chip{color:#c7d7ff}}
.chip:hover{background:var(--accent-soft);border-color:var(--accent)}
.input-row{display:flex;gap:8px;padding:14px 14px 16px;border-top:1px solid var(--line);background:var(--card)}
.input-row input{flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--text);min-height:48px;min-width:0}
.send-btn{background:var(--accent);color:#fff;border:none;padding:0 20px;border-radius:999px;font-weight:700;cursor:pointer;min-height:48px;white-space:nowrap}
.send-btn:hover{background:var(--accent-dark)}
.side{display:flex;flex-direction:column;gap:18px}
.side-card{padding:20px}
.side-card h2{margin:0 0 12px;font-size:18px;line-height:1.3}
.side-card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:10px}
.side-card li{font-size:14.5px;line-height:1.55}
.lead-card{padding:20px;transition:box-shadow .3s,border-color .3s}
.lead-card.highlight{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.lead-card h2{margin:0 0 4px;font-size:18px}
.lead-card p.sub{margin:0 0 14px;color:var(--muted);font-size:14px}
.field{margin-bottom:10px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.field input,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);min-height:48px}
.field textarea{min-height:72px;resize:vertical}
.submit-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:999px;padding:13px;font-weight:700;cursor:pointer;min-height:50px}
.submit-btn:hover{background:var(--accent-dark)}
.success{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;padding:14px;border-radius:12px;font-size:14.5px;line-height:1.55;display:none}
@media(prefers-color-scheme:dark){.success{background:#0b2e22;border-color:#14532d;color:#a7f3d0}}
.success.show{display:block}
.footer{max-width:1120px;margin:0 auto;padding:10px 20px 32px;color:var(--muted);font-size:13.5px;text-align:center;border-top:1px solid var(--line);margin-top:8px}
.notfound{padding:40px 20px;text-align:center}
.hidden{display:none !important}
</style>
</head>

function esc(s){ if(s==null) return ""; return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function getRoute(){
  var h = location.hash || "#/";
  if(h==="#/"||h==="#"||h===""){ return {type:"index"}; }
  if(h.indexOf("#/")===0){ var slug=h.slice(2).split("/")[0].split("?")[0]; return {type:"demo", slug:slug}; }
  return {type:"index"};
}

function slugFromHash(h){
  if(!h || h.indexOf("#/")!==0) return null;
  var s = h.slice(2).split("/")[0].split("?")[0].split("&")[0];
  if(!s) return null;
  try{ s = decodeURIComponent(s); }catch(e){}
  s = s.trim();
  return s || null;
}
function dParamFromSearch(search){
  if(!search) return null;
  var q = search.charAt(0)==="?" ? search.slice(1) : search;
  if(!q) return null;
  var parts = q.split("&");
  for(var i=0;i<parts.length;i++){
    var kv = parts[i].split("=");
    if(kv[0]==="d"){
      var v = kv.slice(1).join("=") || "";
      try{ v = decodeURIComponent(v.replace(/\+/g," ")); }catch(e){}
      v = v.trim();
      return v || null;
    }
  }
  return null;
}
var isInitialLoad = true;
function getInitialRoute(){
  var candidates = [];
  var fromHash = slugFromHash(location.hash || "");
  if(fromHash) candidates.push(fromHash);
  var fromSearch = dParamFromSearch(location.search || "");
  if(fromSearch) candidates.push(fromSearch);
  if(document.referrer){
    var refD = null;
    var refHashSlug = null;
    try{
      var refUrl = new URL(document.referrer);
      refD = dParamFromSearch(refUrl.search || "");
      refHashSlug = slugFromHash(refUrl.hash || "");
      if(!refD && refUrl.hash && refUrl.hash.indexOf("?")!==-1){
        refD = dParamFromSearch(refUrl.hash.slice(refUrl.hash.indexOf("?")));
      }
    }catch(e){
      var raw = document.referrer;
      var qi = raw.indexOf("?");
      if(qi!==-1) refD = dParamFromSearch(raw.slice(qi).split("#")[0]);
      var hi = raw.indexOf("#/");
      if(hi!==-1) refHashSlug = slugFromHash(raw.slice(hi));
    }
    if(refD) candidates.push(refD);
    if(refHashSlug) candidates.push(refHashSlug);
  }
  for(var i=0;i<candidates.length;i++){
    if(bySlug[candidates[i]]) return {type:"demo", slug:candidates[i]};
  }
  return null;
}

function render(){
  var route;
  if(isInitialLoad){
    isInitialLoad = false;
    route = getInitialRoute();
    if(route){
      if((location.hash || "") !== "#/" + route.slug){
        try{ history.replaceState(null, "", "#/" + route.slug); }catch(e){}

    +'<div class="chat-head"><div class="avatar">'+esc(initials)+'</div><div><strong>'+esc(d.name)+' — '+esc(t.assistant)+'</strong><small class="online">'+esc(t.online)+'</small></div></div>'
    +'<div class="messages" id="messages"></div>'
    +'<div class="typing" id="typing"><span></span><span></span><span></span></div>'
    +'<div class="chips-wrap"><div class="chips-label">'+esc(t.tryAsk)+'</div><div class="chips" id="chips">'+chipsHtml+'</div></div>'
    +'<form class="input-row" id="chatForm"><input id="chatInput" type="text" placeholder="'+esc(t.placeholder)+'" autocomplete="off" aria-label="'+esc(t.placeholder)+'"><button class="send-btn" type="submit">'+esc(t.send)+'</button></form>'
    +'</section>'
    +'<section class="card lead-card" id="leadCard" style="margin-top:18px">'
    +'<h2>'+esc(t.leaveTitle)+'</h2><p class="sub">'+esc(t.leaveSub)+'</p>'
    +'<form id="leadForm"><div class="field"><label for="leadName">'+esc(t.name)+'</label><input id="leadName" required placeholder="'+esc(t.namePh)+'"></div>'
    +'<div class="field"><label for="leadPhone">'+esc(t.phone)+'</label><input id="leadPhone" required type="tel" placeholder="'+esc(t.phonePh)+'"></div>'
    +'<div class="field"><label for="leadQ">'+esc(t.question)+'</label><textarea id="leadQ" placeholder="'+esc(t.questionPh)+'"></textarea></div>'
    +'<button class="submit-btn" type="submit">'+esc(t.submit)+'</button></form>'
    +'<div class="success" id="leadSuccess" role="status"></div>'
    +'</section>'
    +'</div>'
    +'<aside class="side"><section class="card side-card"><h2>'+esc(t.whatAdds)+'</h2><ul>'+bulletsHtml+'</ul></section></aside>'
    +'</div>';

  var messagesEl=document.getElementById("messages");
  var typingEl=document.getElementById("typing");
  var chipsEl=document.getElementById("chips");
  var form=document.getElementById("chatForm");
  var input=document.getElementById("chatInput");

  function addMsg(text, who){
    var div=document.createElement("div");
    div.className="msg "+who;
    div.textContent=text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop=messagesEl.scrollHeight;
    return div;
  }
  // greeting
  addMsg(d.greeting,"bot");

  function findAnswer(userText){
    var low=userText.toLowerCase();
    var best=null; var bestScore=0;
    d.qa.forEach(function(item){
      var score=0;
      (item.keys||[]).forEach(function(k){
        if(k && low.indexOf(String(k).toLowerCase())!==-1) score++;
      });
      if(score>bestScore){ bestScore=score; best=item; }
    });
    if(bestScore===0 || !best) return {text:d.fallback, isFallback:true};
    return {text:best.a, isFallback:false};
  }

  function revealLead(){
    var card=document.getElementById("leadCard");
    if(card){
      card.classList.add("highlight");
      setTimeout(function(){ card.scrollIntoView({behavior:"smooth", block:"nearest"}); }, 350);
    }
  }

  function sendUser(text){
    var trimmed=(text||"").trim();
    if(!trimmed) return;
    addMsg(trimmed,"user");
    input.value="";
    typingEl.classList.add("show");
    messagesEl.scrollTop=messagesEl.scrollHeight;
    var delay=600+Math.floor(Math.random()*300);
    setTimeout(function(){
      typingEl.classList.remove("show");
      var ans=findAnswer(trimmed);
      addMsg(ans.text,"bot");
      if(ans.isFallback) revealLead();
    }, delay);
  }

  chipsEl.addEventListener("click",function(e){
    var btn=e.target.closest(".chip");
    if(!btn) return;
    sendUser(btn.textContent);
  });
  form.addEventListener("submit",function(e){ e.preventDefault(); sendUser(input.value); });

  var leadForm=document.getElementById("leadForm");
  var leadSuccess=document.getElementById("leadSuccess");
  leadForm.addEventListener("submit",function(e){
    e.preventDefault();
    leadForm.classList.add("hidden");
    leadSuccess.textContent=t.success;
    leadSuccess.classList.add("show");
    leadSuccess.scrollIntoView({behavior:"smooth", block:"nearest"});
  });
}

window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
